name: OpenRev CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # node:sqlite (Node >= 22.5) is a hard dependency of the real workspace layer.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Type Check
        run: npm run typecheck

      - name: Run Test Suite (unit + adapters + integration)
        run: npm test

      - name: CLI Smoke Test (real APK fixture)
        run: node --import tsx bin/openrev.js analyze tests/fixtures/FixtureApp.apk --json | grep -q '"packageName": "com.example.two_rings"' && echo "CLI OK"

      - name: MCP Server Smoke Test (initialize + analyze_target over stdio)
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"analyze_target","arguments":{"targetPath":"tests/fixtures/FixtureApp.apk"}}}' \
            | node --import tsx packages/mcp-server/src/index.ts \
            | grep -q 'com.example.two_rings' && echo "MCP OK"

  # The browser UI (packages/ui, vite) bundles Node-only core modules and is
  # treated as experimental — it is NOT part of the release gate.
  # See KNOWN_LIMITATIONS.md for details.
