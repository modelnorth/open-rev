name: OpenRev CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Type Check & Verify
        run: npm run dev --workspace=packages/ui -- --help || true

      - name: Run Core & Provider Test Suite
        run: node --test tests/unit/core.test.ts tests/adapters/adapters.test.ts

      - name: Build All Monorepo Workspaces
        run: npm run build --if-present

      - name: CLI Binary Smoke Test
        run: node bin/openrev.js import SampleApp.apk
