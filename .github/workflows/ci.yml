name: OpenRev CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Type Check
        run: npm run typecheck

      - name: Run Core & Provider Test Suite
        run: npm test

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: CLI Binary Smoke Test
        run: node --import tsx bin/openrev.js analyze SampleApp.apk --json

      - name: MCP Server Smoke Test (tools/list over stdio)
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node --import tsx packages/mcp-server/src/index.ts \
            | grep -q '"name":"list_capabilities"' && echo "MCP OK"
