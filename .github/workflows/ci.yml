name: OpenRev CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # node:sqlite (Node >= 22.5) is a hard dependency of the real workspace layer.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Run Test Suite (unit + cli + adapters + integration + mcp)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/openrev-test.log

      - name: Report failing tests (step summary)
        if: failure()
        shell: bash
        run: |
          {
            echo "### Failing tests"
            grep -aE "failing tests|✖|not ok" /tmp/openrev-test.log | head -20 || echo "no failing-test lines found"
            echo ""
            echo "#### tail of test log"
            tail -40 /tmp/openrev-test.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage Report
        shell: bash
        run: npm run test:coverage 2>&1 | grep -E "all files|line %"

      - name: Security Audit (secrets + supply chain)
        shell: bash
        run: |
          node scripts/security_audit.mjs
          npm audit --omit=dev

      - name: CLI Smoke Test (real APK fixture)
        shell: bash
        run: |
          node --import tsx bin/openrev.js analyze tests/fixtures/FixtureApp.apk --json | grep -q 'com.example.two_rings' && echo "CLI OK"

      - name: MCP Server Smoke Test (initialize + analyze_target over stdio)
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"analyze_target","arguments":{"targetPath":"tests/fixtures/FixtureApp.apk"}}}' \
            | node --import tsx packages/mcp-server/src/index.ts \
            | grep -q 'com.example.two_rings' && echo "MCP OK"

  # Build the Tauri desktop app on all supported OSes. macOS/Linux cannot be
  # built on a Windows dev machine, so this job IS the cross-platform gate
  # (see V1_GATE_AUDIT.md). GitHub runners preinstall VS Build Tools (Windows),
  # Xcode CLT (macOS), and rustup (all); Linux needs the WebKitGTK system deps.
  desktop-build:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Tauri v1 needs webkit2gtk-4.0 (libwebkit2gtk-4.0-dev), which exists on
        # Ubuntu <= 22.04 only (removed in 24.04). Pin Linux to 22.04.
        os: [ubuntu-22.04, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Frontend (vite)
        run: npm run build:ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (WebKitGTK etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Desktop (cargo release)
        run: cargo build --release --locked
        working-directory: packages/desktop/src-tauri

      - name: Verify binary exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="packages/desktop/src-tauri/target/release/openrev-desktop.exe"; else BIN="packages/desktop/src-tauri/target/release/openrev-desktop"; fi
          test -x "$BIN" && echo "DESKTOP BUILD OK: $BIN"

      - name: Launch smoke (best-effort, headless-friendly)
        shell: bash
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb >/dev/null 2>&1 || true
            xvfb-run -a timeout 10 packages/desktop/src-tauri/target/release/openrev-desktop >/dev/null 2>&1; code=$?
            # 124 = timed out while running (app stayed alive) -> treat as OK
            [ $code -eq 124 ] && echo "LAUNCH OK (alive until timeout)" || echo "launch exited with $code"
          else
            timeout 10 packages/desktop/src-tauri/target/release/openrev-desktop >/dev/null 2>&1; code=$?
            [ $code -eq 124 ] && echo "LAUNCH OK (alive until timeout)" || echo "launch exited with $code"
          fi

  # The desktop UI/analysis backend is real; macOS/Linux builds are verified
  # by the desktop-build job above. See KNOWN_LIMITATIONS.md.
